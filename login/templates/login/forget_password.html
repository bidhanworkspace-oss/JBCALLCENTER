<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f8fafc; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
        .card { background: white; padding: 2rem; border-radius: 12px; border: 1px solid #e2e8f0; width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.875rem; margin-bottom: 0.25rem; }
        input { width: 100%; padding: 0.625rem; border: 1px solid #cbd5e1; border-radius: 6px; }
        .btn { width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .alert-error { background: #fdeeea; border: 1px solid #f5c6bd; color: #a33a2f; }
        .alert-success { background: #e7f3e9; border: 1px solid #c3e4cb; color: #14603e; }
        .loader-overlay { position: fixed; inset: 0; background: rgba(248, 250, 252, .85); display: none; align-items: center; justify-content: center; z-index: 50; }
        .loader-overlay.show { display: flex; }
        .loader-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem 2rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: .85rem; }
        .spinner { width: 34px; height: 34px; border: 3px solid #dbeafe; border-top-color: #2563eb; border-radius: 50%; animation: spin .7s linear infinite; }
        .loader-text { font-size: .875rem; color: #334155; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Reset Password</h2>

        {% if messages %}
        <div class="alerts" style="margin-bottom: 1rem; display: grid; gap: .5rem;">
            {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}"
                 style="padding: .7rem .85rem; border-radius: 8px; font-size: .85rem; line-height: 1.45;">
                <strong style="margin-right:.3rem;">{% if message.tags == 'error' %}Failed:{% else %}Success:{% endif %}</strong>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form action="{% url 'forgot_password' %}" method="POST" id="forgotPasswordForm">
            {% csrf_token %}
            <div class="form-group">
                <label>User ID</label>
                <input type="text" name="user_id" required>
            </div>
            <div class="form-group">
                <label>Registered Email</label>
                <input type="email" name="email" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Send Temporary Password</button>
        </form>
    </div>

    <div class="loader-overlay" id="loaderOverlay" role="status" aria-live="polite">
        <div class="loader-box">
            <div class="spinner"></div>
            <div class="loader-text">Sending your temporary password&hellip;</div>
        </div>
    </div>

    <script>
        (function () {
            var form = document.getElementById('forgotPasswordForm');
            var overlay = document.getElementById('loaderOverlay');
            var button = document.getElementById('submitBtn');
            var submitting = false;

            function lock() {
                submitting = true;
                button.disabled = true;
                overlay.classList.add('show');
            }

            function unlock() {
                submitting = false;
                button.disabled = false;
                overlay.classList.remove('show');
            }

            form.addEventListener('submit', function (event) {
                // Let the browser report invalid/empty fields first.
                if (!form.checkValidity()) {
                    return;
                }
                event.preventDefault();
                lock();
                form.submit();
            });

            // Restored from the back/forward cache after a failed submit.
            window.addEventListener('pageshow', function (event) {
                if (event.persisted || submitting) {
                    unlock();
                }
            });
        })();
    </script>
</body>
</html>
