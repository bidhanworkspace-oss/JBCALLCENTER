<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f8fafc; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
        .card { background: white; padding: 2rem; border-radius: 12px; border: 1px solid #e2e8f0; width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.875rem; margin-bottom: 0.25rem; }
        input { width: 100%; padding: 0.625rem; border: 1px solid #cbd5e1; border-radius: 6px; }
        .btn { width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .alert-error { background: #fdeeea; border: 1px solid #f5c6bd; color: #a33a2f; }
        .alert-success { background: #e7f3e9; border: 1px solid #c3e4cb; color: #14603e; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Reset Password</h2>

        {% if messages %}
        <div class="alerts" style="margin-bottom: 1rem; display: grid; gap: .5rem;">
            {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}"
                 style="padding: .7rem .85rem; border-radius: 8px; font-size: .85rem; line-height: 1.45;">
                <strong style="margin-right:.3rem;">{% if message.tags == 'error' %}Failed:{% else %}Success:{% endif %}</strong>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form action="{% url 'forgot_password' %}" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>User ID</label>
                <input type="text" name="user_id" required>
            </div>
            <div class="form-group">
                <label>Registered Email</label>
                <input type="email" name="email" required>
            </div>
            <button type="submit" class="btn">Send Temporary Password</button>
        </form>
    </div>
</body>
</html>
